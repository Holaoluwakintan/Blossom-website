backend:
  name: github
  repo: Holaoluwakintan/Blossom-website
  branch: main

media_folder: "public/assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "books"
    label: "Books"
    folder: "src/content/books"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Subtitle", name: "subtitle", widget: "string", required: false }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Author", name: "author", widget: "string", default: "Olaoluwa Michael" }
      - { label: "Cover Image", name: "cover_image_url", widget: "image" }
      - { label: "Synopsis", name: "synopsis", widget: "text" }
      - { label: "Description", name: "description", widget: "markdown" }
      - { label: "Genre", name: "genre", widget: "string" }
      - { label: "Publication Year", name: "publication_year", widget: "number", value_type: "int" }
      - { label: "Price (NGN)", name: "price_ngn", widget: "number", required: false }
      - { label: "Featured", name: "featured", widget: "boolean", default: false }

  - name: "journal"
    label: "Journal Articles"
    folder: "src/content/journal"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Slug", name: "slug", widget: "string" }
      - { label: "Publish Date", name: "published_at", widget: "datetime" }
      - { label: "Featured Image", name: "featured_image_url", widget: "image" }
      - { label: "Category", name: "category", widget: "select", options: ["Faith & Purpose", "Writing & Books", "Stickman Stories", "AI & Creativity", "Personal Reflections"] }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }